<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Red Ball</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:monospace;overflow:hidden;touch-action:none;user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}
#hud{font-size:14px;padding:6px;letter-spacing:2px}
#wrap{position:relative;width:min(100vw,calc((100vh - 120px)*320/176))}
canvas{width:100%;display:block;image-rendering:pixelated;background:#6ec6ff}
#msg{position:absolute;inset:0;display:none;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:rgba(0,0,0,.65);text-align:center;font-size:clamp(14px,4vw,28px)}
button{font:inherit;background:#e01010;color:#fff;border:3px solid #6b0000;padding:10px 18px;cursor:pointer}
#pad{display:none;width:100%;justify-content:space-between;padding:10px 14px;box-sizing:border-box}
#pad button{width:76px;height:64px;font-size:22px;opacity:.85}
@media (pointer:coarse){#pad{display:flex}}
</style></head><body>
<div id="hud"></div>
<div id="wrap"><canvas id="c"></canvas>
<div id="msg"><div>YOU WIN!<br><small id="sc"></small></div><button onclick="restart()">PLAY AGAIN</button></div></div>
<div id="pad"><div><button id="bl">◀</button> <button id="br">▶</button></div><button id="bj">JUMP</button></div>
<script>
const T=16,VW=320,VH=176,c=document.getElementById('c'),x=c.getContext('2d');
c.width=VW;c.height=VH;
let LV=[],lv=0,map,W,ents,p,cam=0,deaths=0,state='play',sx,sy,flash=0,fc='#f00',keys={};
const hud=document.getElementById('hud'),msg=document.getElementById('msg');

function load(n){
  const L=LV[n];let w=0;
  for(const m of L.ground.matchAll(/([#.])(\d+)/g))w+=+m[2];
  W=w;map=Array.from({length:11},()=>Array(W).fill('.'));
  let col=0;
  for(const m of L.ground.matchAll(/([#.])(\d+)/g))for(let i=0;i<+m[2];i++){map[9][col]=map[10][col]=m[1];col++}
  ents=[];
  for(const [ch,cx,cy,wd=1] of L.objs)for(let i=0;i<wd;i++){
    const X=cx+i;
    if(ch==='S'){sx=X*T+2;sy=cy*T+4}
    else if(ch==='e')ents.push({x:X*T+2,y:cy*T+4,w:12,h:12,vx:.6,a:true});
    else map[cy][X]=ch;
  }
  spawn();
}
function spawn(){p={x:sx,y:sy,w:12,h:12,vx:0,vy:0,g:false,r:0,f:1};
  ents.forEach(e=>e.a=true);updHud()}
function updHud(){hud.textContent=`LEVEL ${lv+1}/${LV.length}   DEATHS ${deaths}`}
function die(){deaths++;flash=14;fc='#f00';spawn()}
function restart(){msg.style.display='none';deaths=0;lv=0;state='play';load(0)}

function T_(px,py){const cc=Math.floor(px/T),r=Math.floor(py/T);
  if(cc<0||cc>=W)return '#';if(r<0||r>10)return '.';return map[r][cc]}
function hit(b){for(const px of [b.x,b.x+b.w-.01])for(const py of [b.y,b.y+b.h/2,b.y+b.h-.01])
  if(T_(px,py)==='#')return true;return false}
function touch(ch,low){
  const a=p.x+2,b=p.x+p.w-2,t=p.y+2,d=p.y+p.h-1;
  for(let r=Math.floor(t/T);r<=Math.floor(d/T);r++)for(let k=Math.floor(a/T);k<=Math.floor(b/T);k++)
    if(r>=0&&r<=10&&k>=0&&k<W&&map[r][k]===ch&&(!low||d>r*T+8))return true;
  return false}

function step(){
  const ax=(keys.l?-1:0)+(keys.r?1:0);
  if(ax)p.f=ax;
  p.vx=(p.vx+ax*.25)*.9;
  if(keys.j&&p.g){p.vy=-5.3;p.g=false}
  if(!keys.j&&p.vy<-2.2)p.vy=-2.2;
  p.vy=Math.min(p.vy+.28,7);
  p.x+=p.vx;
  if(hit(p)){p.x=p.vx>0?Math.floor((p.x+p.w)/T)*T-p.w-.01:(Math.floor(p.x/T)+1)*T;p.vx=0}
  p.y+=p.vy;p.g=false;
  if(hit(p)){
    if(p.vy>0){p.y=Math.floor((p.y+p.h)/T)*T-p.h-.01;p.g=true}
    else p.y=(Math.floor(p.y/T)+1)*T;
    p.vy=0}
  p.r+=p.vx/6;
  for(const e of ents){
    if(!e.a)continue;
    e.x+=e.vx;const fx=e.x+(e.vx>0?e.w:0);
    if(T_(fx,e.y+6)==='#'||T_(fx,e.y+e.h+2)!=='#'){e.vx*=-1;e.x+=e.vx*2}
    if(p.x<e.x+e.w&&p.x+p.w>e.x&&p.y<e.y+e.h&&p.y+p.h>e.y){
      if(p.vy>0&&p.y+p.h-e.y<9){e.a=false;p.vy=-4.5}else return die()}
  }
  if(touch('^',true)||p.y>VH+10)return die();
  if(touch('G')){
    flash=14;fc='#0f0';lv++;
    if(lv>=LV.length){state='win';document.getElementById('sc').textContent='DEATHS: '+deaths;msg.style.display='flex';lv=LV.length-1}
    else load(lv);
  }
  cam=Math.max(0,Math.min(p.x+6-VW/2,W*T-VW));
}

function ball(cx,cy){
  for(let dy=-6;dy<6;dy++)for(let dx=-6;dx<6;dx++){
    const d=(dx+.5)**2+(dy+.5)**2;if(d>36)continue;
    x.fillStyle=d>26?'#6b0000':(dx<-1&&dy<-1&&d<14?'#ff6b6b':'#e01010');
    x.fillRect(cx+dx,cy+dy,1,1)}
  x.fillStyle='#a00000';
  x.fillRect(cx+Math.round(Math.cos(p.r)*3)-1,cy+Math.round(Math.sin(p.r)*3)-1,2,2);
  const f=p.f>0?1:-1;
  for(const ex of [cx-4+f,cx+f]){
    x.fillStyle='#fff';x.fillRect(ex,cy-3,3,4);
    x.fillStyle='#000';x.fillRect(ex+(f>0?2:0),cy-2,1,2)}
}

function draw(){
  const cx0=Math.round(cam);
  ['#5ab4f0','#6ec6ff','#8fd4ff','#b4e3ff'].forEach((col,i)=>{x.fillStyle=col;x.fillRect(0,i*44,VW,44)});
  x.fillStyle='#fff';
  for(let i=0;i<9;i++){const px=((i*110-cam*.3)%480+480)%480-80,py=18+(i*37)%60;
    x.fillRect(Math.round(px),py,30,6);x.fillRect(Math.round(px)+6,py-4,18,4)}
  const c0=Math.floor(cx0/T),c1=c0+VW/T+1;
  for(let r=0;r<11;r++)for(let k=c0;k<=c1&&k<W;k++){
    const ch=map[r][k],X=k*T-cx0,Y=r*T;
    if(ch==='#'){
      x.fillStyle='#3a2a1a';x.fillRect(X,Y,T,T);
      x.fillStyle='#4b3826';x.fillRect(X+3,Y+5,3,3);x.fillRect(X+10,Y+11,3,3);
      x.fillStyle='#1e150c';x.fillRect(X,Y+T-1,T,1);x.fillRect(X+T-1,Y,1,T);
      if(!r||map[r-1][k]!=='#'){x.fillStyle='#3fa34d';x.fillRect(X,Y,T,4);x.fillStyle='#6fd36f';x.fillRect(X,Y,T,1)}
    }else if(ch==='^'){
      x.fillStyle='#c9d1d9';
      for(const s of [0,8])for(let i=0;i<8;i++){const w=2+(i>>1)*2;x.fillRect(X+s+4-w/2,Y+8+i,w,1)}
    }else if(ch==='G'){
      x.fillStyle='#ddd';x.fillRect(X+7,Y,2,T);
      x.fillStyle='#ffd400';x.fillRect(X+9,Y+1,7,6);x.fillStyle='#000';x.fillRect(X+11,Y+3,2,2);
    }
  }
  for(const e of ents){if(!e.a)continue;
    const X=Math.round(e.x-cx0),Y=Math.round(e.y);
    x.fillStyle='#4a1a6b';x.fillRect(X,Y,12,12);x.fillStyle='#2b0d40';x.fillRect(X,Y+11,12,1);
    x.fillStyle='#fff';x.fillRect(X+2,Y+3,3,3);x.fillRect(X+7,Y+3,3,3);
    x.fillStyle='#f00';x.fillRect(X+3,Y+4,1,2);x.fillRect(X+8,Y+4,1,2)}
  ball(Math.round(p.x-cx0+6),Math.round(p.y+6));
  if(flash>0){x.globalAlpha=flash/40;x.fillStyle=fc;x.fillRect(0,0,VW,VH);x.globalAlpha=1;flash--}
}

let last=performance.now(),acc=0;
function loop(t){acc+=Math.min(t-last,100);last=t;
  while(acc>=16.67){if(state==='play')step();acc-=16.67}
  draw();requestAnimationFrame(loop)}

const K={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j'};
addEventListener('keydown',e=>{if(K[e.code]){keys[K[e.code]]=1;e.preventDefault()}if(e.code==='KeyR'&&state==='play')die()});
addEventListener('keyup',e=>{if(K[e.code])keys[K[e.code]]=0});
for(const [id,k] of [['bl','l'],['br','r'],['bj','j']]){
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1});
  for(const ev of ['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,()=>keys[k]=0)}

fetch('/api/levels').then(r=>r.json()).then(d=>{LV=d;load(0);requestAnimationFrame(loop)});
</script></body></html>
